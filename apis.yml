  note: >-
    Added deliberately, not from a submission. It surfaced while separating two companies that
    share the name LinkPeek: one of them is hosted on a raw IP behind this service, and sslip.io
    itself turned out to be a real, long-running open-source project worth cataloguing on its own.
    ONE SERVICE, TWO DOMAINS. sslip.io/ issues a 301 to nip.io/, and the shared page is titled
    "Welcome to nip.io / sslip.io" and dedicated to the late Roopinder Singh, who created and ran
    nip.io. The slug follows the canonical domain after the redirect. Both domains are recorded
    because both remain live for DNS: verified by resolution, 93-184-216-34.nip.io and
    93-184-216-34.sslip.io each return 93.184.216.34.
    apis[] IS EMPTY ON PURPOSE. The interface here is DNS itself, not HTTP — there is no REST
    surface to describe. /api, /api/v1 and /metrics all redirect, and apis.json, llms.txt,
    openapi.json and .well-known/api-catalog return real 404s of 153 bytes on nip.io. Nothing was
    modelled to fill that in. This is a valid service with a genuine machine interface and no
    published contract, so it is listed and will score on what it publishes.
    The open-source server is cunnie/sslip.io — Go, Apache-2.0, 1,119 stars at the time of
    writing. Its repository metadata is kept under packages/ as evidence rather than as a claim.
