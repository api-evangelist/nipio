aid: nipio
name: nip.io / sslip.io
description: >-
  nip.io and sslip.io are a single wildcard-DNS service that resolves any hostname containing an
  embedded IP address to that address — 93-184-216-34.nip.io and 93.184.216.34.sslip.io both
  return 93.184.216.34, with no signup, no configuration and no records to create. It exists so
  developers can put a real hostname in front of an arbitrary IP for local development, TLS
  testing, Kubernetes ingress and CI, and it has been in operation for over ten years. The
  operators state the service answers more than 20,000 queries per second. The DNS server behind
  it is open source: cunnie/sslip.io, written in Go and licensed Apache-2.0.
